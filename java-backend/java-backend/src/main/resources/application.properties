spring.application.name=virtual-classroom

# ===== 服务器 =====
server.port=8081

# ===== MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/virtual_classroom?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== MyBatis =====
mybatis.type-aliases-package=com.example.javabackend.entity
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# ===== JSON =====
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Shanghai
